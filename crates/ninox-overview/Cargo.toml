[package]
name        = "ninox-overview"
version     = "0.37.0"
edition     = "2021"
description = "Shared graph/tree/state data model for the fleet-overview screen (TUI + GUI)."
license     = "MIT"
repository  = "https://github.com/Made-by-Moonlight/ninox"

[dependencies]
ninox-core = { path = "../ninox-core", version = "0.37.0" }
serde      = { workspace = true }

[dev-dependencies]
ninox-core = { path = "../ninox-core", version = "0.37.0", features = ["test-isolation"] }
