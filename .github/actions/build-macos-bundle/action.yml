name: Build macOS app bundle
description: >
  Build Ninox.app, verify its structure, ad-hoc code-sign
  it, verify the signature, and (optionally) zip it with ditto. Shared by
  ci.yml and release.yml so the build/sign
  sequence can't drift between them.

inputs:
  zip:
    description: Whether to zip the signed bundle into Ninox.app.zip with ditto
    required: false
    default: "true"

outputs:
  bundle-path:
    description: Path to the built, signed Ninox.app bundle
    value: ${{ steps.paths.outputs.bundle }}
  zip-path:
    description: Path to Ninox.app.zip (only produced when the zip input is true)
    value: ${{ steps.paths.outputs.zip }}

runs:
  using: composite
  steps:
    - name: Build Ninox.app
      shell: bash
      run: |
        set -euo pipefail
        cargo build --release --locked -p ninox-gui
        app=target/release/bundle/osx/Ninox.app
        mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
        cp target/release/ninox-gui "$app/Contents/MacOS/ninox-gui"
        cp crates/ninox-gui/assets/Ninox.icns "$app/Contents/Resources/Ninox.icns"
        version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ninox-gui") | .version')
        plist="$app/Contents/Info.plist"
        # The CI cache can contain an older bundle. Start a fresh dictionary
        # so repeated builds do not fail on keys from the cached plist.
        printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict/></plist>' > "$plist"
        /usr/libexec/PlistBuddy -c 'Add :CFBundleName string Ninox' "$plist"
        /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string Ninox' "$plist"
        /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.madebymoonlight.ninox' "$plist"
        /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string ninox-gui' "$plist"
        /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFile string Ninox.icns' "$plist"
        /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$plist"
        /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $version" "$plist"
        /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $version" "$plist"
        /usr/libexec/PlistBuddy -c 'Add :NSHighResolutionCapable bool true' "$plist"

    - name: Verify bundle
      shell: bash
      run: |
        set -euo pipefail
        test -d target/release/bundle/osx/Ninox.app
        test -x target/release/bundle/osx/Ninox.app/Contents/MacOS/ninox-gui
        test -f target/release/bundle/osx/Ninox.app/Contents/Resources/Ninox.icns
        /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" target/release/bundle/osx/Ninox.app/Contents/Info.plist

    # Ad-hoc signing (identity "-") since there's no paid Apple Developer ID
    # / notarization available. This clears the "'Ninox' is damaged and
    # can't be opened" Gatekeeper error that an unsigned bundle downloaded
    # with the com.apple.quarantine attribute triggers. It does NOT clear
    # the standard "unidentified developer" first-run prompt — only real
    # notarization does that — see the README's macOS app bundle section.
    - name: Ad-hoc sign Ninox.app
      shell: bash
      run: codesign --force --deep --sign - target/release/bundle/osx/Ninox.app

    - name: Verify code signature
      shell: bash
      run: codesign --verify --deep --strict target/release/bundle/osx/Ninox.app

    - name: Zip Ninox.app
      if: inputs.zip == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd target/release/bundle/osx
        ditto -c -k --sequesterRsrc --keepParent Ninox.app Ninox.app.zip

    - id: paths
      shell: bash
      run: |
        echo "bundle=target/release/bundle/osx/Ninox.app" >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.zip }}" = "true" ]; then
          echo "zip=target/release/bundle/osx/Ninox.app.zip" >> "$GITHUB_OUTPUT"
        fi
