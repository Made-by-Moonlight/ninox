name: Publish to CodeArtifact

# Private-registry counterpart to publish.yml (crates.io). This repo is
# mirrored to a second, private remote that isn't linked from here. Both
# remotes carry an identical copy of every workflow file (mirrored history,
# no `if: github.repository == ...` gates anywhere). Per-repo behavior comes
# entirely from repo settings, not YAML conditions:
#   - this (public) repo:  this workflow is disabled
#                           (`gh workflow disable publish-codeartifact.yml`)
#   - the private mirror:  publish.yml (crates.io) is disabled
#                           (`gh workflow disable publish.yml`); ci.yml,
#                           release.yml, and this workflow all stay enabled.
#                           release.yml on the private mirror cuts its own
#                           version bump + tag from internal-only merges
#                           (PRs opened directly there, not synced from this
#                           repo) — that's what actually triggers this
#                           workflow's tag-push path for them, the same way
#                           this (public) repo's release.yml drives
#                           publish.yml. The two repos mint `vX.Y.Z` tags
#                           independently from their own commit history, so
#                           the same version number can point at different
#                           content between them; accepted, since each
#                           publishes to a separate registry (CodeArtifact
#                           vs crates.io) with no shared namespace.
#
# As belt-and-braces on top of that disable scheme, this workflow also no-ops
# gracefully (see "Check CodeArtifact configuration" below) if its required
# repo variables aren't set — so even an accidental re-enable on the wrong
# repo does nothing.
#
# Publishes ninox-core, ninox-server, and ninox (the native app binary crate)
# to a private Cargo registry hosted on AWS CodeArtifact, in dependency
# order, using GitHub OIDC to assume an AWS IAM role — no long-lived AWS
# keys stored in this repo. Each crate is only actually published if its
# current Cargo.toml version isn't already live in the CodeArtifact
# repository, so merges that don't bump a version are a no-op — bump a
# crate's version in the PR you want released, same as publish.yml.
#
# Required repo variables (Settings → Secrets and variables → Actions →
# Variables), all unset by default so this workflow no-ops until configured:
#   AWS_REGION                    AWS region of the CodeArtifact domain
#   CODEARTIFACT_DOMAIN           the CodeArtifact domain name
#   CODEARTIFACT_DOMAIN_OWNER     AWS account ID that owns the domain
#   CODEARTIFACT_REPOSITORY       the CodeArtifact repository name — this
#                                 also becomes the Cargo registry name used
#                                 by `cargo publish --registry`
#   CODEARTIFACT_PUBLISH_ROLE_ARN ARN of the IAM role this workflow assumes
#                                 via OIDC (a plain repo variable is fine —
#                                 role ARNs aren't secret; a repo secret of
#                                 the same name also works if preferred)
#
# One-time setup needed on the private mirror before this can publish
# anything: a CodeArtifact repository that accepts the "cargo" package
# format, an IAM role that trusts this repo's GitHub OIDC identity and is
# scoped to publish into that repository, and the five repo variables above
# set to the real values. This workflow only reads those variables — it
# never assumes or hardcodes any particular AWS account, domain, or role.
#
# Auth flow: aws-actions/configure-aws-credentials assumes the IAM role via
# OIDC, then the "Configure Cargo for CodeArtifact" step wires Cargo up by
# hand — `aws codeartifact login` has no cargo tool, so it writes
# ~/.cargo/config.toml itself: the repository's sparse index as a named
# registry, plus a cargo:token-from-stdout credential provider that runs
# `aws codeartifact get-authorization-token` whenever Cargo needs
# credentials. Cargo sends that token verbatim in the Authorization
# header — no "Bearer " prefix; the registry rejects a prefixed token
# with 401 — and minting on demand means no token is stored on disk and
# no publish can outlive one. That step also replaces the crates-io
# source with the CodeArtifact repository, so dependency resolution
# during publish verification goes through CodeArtifact too:
# already-published ninox crates come from the repository itself (the
# package-group origin controls block them from the crates.io upstream)
# and third-party crates come through the crates.io pull-through cache.
#
# On top of publishing crates, this workflow also creates the GitHub
# Release for each synced tag on this (private) repo. release.yml — which
# cuts the release on the public repo — is disabled here, so without this,
# tags land on the private mirror already-tagged but with no release
# object behind them: crates but no release page, no .app download. The
# `release` job below closes that gap so internal engineers never need to
# visit the public repo for either.
#
# It creates a draft release for the tag if one doesn't already exist
# (idempotent — a re-run against a tag that already has a release, e.g.
# after a failed first attempt, reuses it instead of erroring or
# duplicating), then builds, ad-hoc code-signs, verifies, and zips the
# macOS bundle via the shared .github/actions/build-macos-bundle composite
# action (the same one ci.yml and release.yml use), uploads it with
# --clobber, and only un-drafts the release once that upload succeeds — so
# a failed build leaves a draft rather than a public release missing its
# asset.
#
# It only runs on tag pushes (not the plain `main` push side of this
# workflow's trigger, which exists solely for crate publishing) and
# depends on (needs:) the publish job succeeding, so a tag whose crates
# failed to publish doesn't get a release cut for it either. It reuses
# that job's `configured` output rather than re-deriving it, so the same
# "no required repo variable set → no-op" guard covers both jobs — an
# accidental re-enable of this whole file on an unconfigured repo does
# nothing in either job.
#
# The same `release` job then publishes prebuilt Apple silicon artifacts as a
# CodeArtifact *generic* package (namespace `ninox`, package `ninox-macos`,
# version = the `ninox` crate version), reusing the binary and Ninox.app.zip
# it just built — so internal users can install without compiling
# (scripts/install-macos.sh, `ninox update`). Assets, in publish order:
#   install-macos.sh, ninox-<v>-aarch64-apple-darwin.tar.gz, Ninox.app.zip
# All but the last are published with --unfinished; the last call flips the
# version to Published. A re-run skips assets already present on an
# Unfinished version and skips a Published version entirely. Asset names
# and coordinates must stay in sync with
# crates/ninox-core/src/lifecycle/binary_update.rs and the install script.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # AWS OIDC — no long-lived credentials

concurrency:
  group: publish-codeartifact
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    env:
      CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN }}
      CODEARTIFACT_DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
      CODEARTIFACT_REPOSITORY: ${{ vars.CODEARTIFACT_REPOSITORY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CODEARTIFACT_PUBLISH_ROLE_ARN: ${{ vars.CODEARTIFACT_PUBLISH_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check CodeArtifact configuration
        id: config
        run: |
          if [ -z "$CODEARTIFACT_DOMAIN" ] || [ -z "$CODEARTIFACT_DOMAIN_OWNER" ] || \
             [ -z "$CODEARTIFACT_REPOSITORY" ] || [ -z "$AWS_REGION" ] || \
             [ -z "$CODEARTIFACT_PUBLISH_ROLE_ARN" ]; then
            echo "::notice::CodeArtifact publishing isn't configured on this repository (one or more of AWS_REGION, CODEARTIFACT_DOMAIN, CODEARTIFACT_DOMAIN_OWNER, CODEARTIFACT_REPOSITORY, CODEARTIFACT_PUBLISH_ROLE_ARN repo variables is unset) — skipping. See the header of this workflow for required setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.CODEARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # This session has to outlive the whole publish (Cargo auth
          # tokens are minted from it on demand, so they can't expire
          # mid-run on their own). 1 h is a comfortable budget: the same
          # three-crate verify-and-publish flow takes ~5 min against
          # crates.io on this runner class, and first-time pull-through
          # ingestion doesn't change the order of magnitude.
          role-duration-seconds: 3600

      # A transient AWS error here must not be mistaken for "not published"
      # — that would send the job into a doomed duplicate publish — so only
      # ResourceNotFoundException counts as absent; anything else fails the
      # step.
      - name: Determine publish plan
        id: plan
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          any=false
          for entry in ptyd:ninox-ptyd core:ninox-core server:ninox-server app:ninox; do
            key="${entry%%:*}"
            crate="${entry##*:}"
            version=$(echo "$metadata" | jq -r --arg n "$crate" '.packages[] | select(.name==$n) | .version')
            echo "${key}_version=${version}" >> "$GITHUB_OUTPUT"
            if err=$(aws codeartifact describe-package-version \
                --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
                --repository "$CODEARTIFACT_REPOSITORY" --format cargo \
                --package "${crate}" --package-version "${version}" 2>&1 > /dev/null); then
              echo "${crate} ${version} is already published — skipping."
              echo "${key}_publish=false" >> "$GITHUB_OUTPUT"
            elif grep -q "ResourceNotFoundException" <<< "$err"; then
              echo "${crate} ${version} is not yet published — will publish."
              echo "${key}_publish=true" >> "$GITHUB_OUTPUT"
              any=true
            else
              echo "Unexpected error checking ${crate} ${version}:" >&2
              echo "$err" >&2
              exit 1
            fi
          done
          echo "any_publish=${any}" >> "$GITHUB_OUTPUT"

      # Everything below only matters when something will actually be
      # published, so no-op runs (any main push without a version bump)
      # skip the apt install and never mint registry credentials.
      - name: Install system dependencies
        if: steps.config.outputs.configured == 'true' && steps.plan.outputs.any_publish == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      # Polls the repository's sparse index — the surface the next
      # `cargo publish` actually resolves dependencies from — rather than
      # the control-plane describe-package-version API, which the index can
      # lag behind.
      - name: Install wait-for-crate helper
        if: steps.config.outputs.configured == 'true' && steps.plan.outputs.any_publish == 'true'
        run: |
          cat <<'SCRIPT' > /tmp/wait-for-crate.sh
          #!/usr/bin/env bash
          set -euo pipefail
          crate="$1"
          version="$2"
          endpoint=$(aws codeartifact get-repository-endpoint \
            --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY" --format cargo \
            --query repositoryEndpoint --output text)
          token=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken --output text)
          echo "::add-mask::${token}"
          # Sparse-index path scheme for names of >= 4 characters (all of
          # ours): first two chars / next two chars / full name.
          index_path="${crate:0:2}/${crate:2:2}/${crate}"
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: ${token}" \
                "${endpoint}${index_path}" 2> /dev/null \
                | jq -e -s --arg v "${version}" 'any(.[]; .vers == $v)' > /dev/null; then
              echo "${crate} ${version} is live in the index."
              exit 0
            fi
            echo "Waiting for ${crate} ${version} to appear in the index (attempt ${i})..."
            sleep 10
          done
          echo "Timed out waiting for ${crate} ${version}." >&2
          exit 1
          SCRIPT
          chmod +x /tmp/wait-for-crate.sh

      # `aws codeartifact login` doesn't support cargo as a --tool, so this
      # configures Cargo by hand, following the CodeArtifact cargo docs for
      # Linux: a named registry with the repository's sparse index for
      # publishing, crates-io source replacement so dependency resolution
      # during publish verification also goes through CodeArtifact, and a
      # cargo:token-from-stdout credential provider that mints a fresh
      # authorization token from the job's AWS credentials whenever Cargo
      # asks for one. Cargo sends that token verbatim in the Authorization
      # header — the registry expects the raw token, no "Bearer " prefix —
      # and nothing token-like is ever written to disk.
      - name: Configure Cargo for CodeArtifact
        if: steps.config.outputs.configured == 'true' && steps.plan.outputs.any_publish == 'true'
        run: |
          set -euo pipefail
          endpoint=$(aws codeartifact get-repository-endpoint \
            --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY" --format cargo \
            --query repositoryEndpoint --output text)
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [registries.${CODEARTIFACT_REPOSITORY}]
          index = "sparse+${endpoint}"
          credential-provider = "cargo:token-from-stdout aws codeartifact get-authorization-token --domain ${CODEARTIFACT_DOMAIN} --domain-owner ${CODEARTIFACT_DOMAIN_OWNER} --region ${AWS_REGION} --query authorizationToken --output text"

          [source.crates-io]
          replace-with = "${CODEARTIFACT_REPOSITORY}"
          EOF

      # CodeArtifact serves crates.io metadata from a regional cache that,
      # for infrequently requested crates, refreshes only when the crate's
      # index file is requested — the first request returns the stale
      # version list and triggers an asynchronous update. Cargo stops
      # resolving at the first crate whose locked version is missing, so
      # left to itself it discovers stale crates one publish attempt at a
      # time. Instead: request the index file of every registry dependency
      # in Cargo.lock up front (kicking off all the refreshes at once),
      # then poll `cargo fetch --locked` until the index can satisfy the
      # whole lockfile.
      - name: Wait for CodeArtifact index to cover Cargo.lock
        if: steps.config.outputs.configured == 'true' && steps.plan.outputs.any_publish == 'true'
        run: |
          set -euo pipefail
          endpoint=$(aws codeartifact get-repository-endpoint \
            --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY" --format cargo \
            --query repositoryEndpoint --output text)
          token=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken --output text)
          echo "::add-mask::${token}"
          # Every registry-sourced package in the lockfile (workspace
          # members have no `source`), mapped to its sparse-index path.
          python3 - <<'PY' > /tmp/index-paths.txt
          import tomllib
          with open("Cargo.lock", "rb") as f:
              lock = tomllib.load(f)
          for raw in sorted({p["name"] for p in lock["package"] if "source" in p}):
              name = raw.lower()  # index paths are lowercased per the registry spec
              if len(name) == 1:
                  print(f"1/{name}")
              elif len(name) == 2:
                  print(f"2/{name}")
              elif len(name) == 3:
                  print(f"3/{name[0]}/{name}")
              else:
                  print(f"{name[:2]}/{name[2:4]}/{name}")
          PY
          # Touch every index file; 404s (never-cached crates) and other
          # errors are fine — the point is triggering the refreshes.
          xargs -P 16 -I{} curl -fs -o /dev/null --max-time 30 -H "Authorization: ${token}" "${endpoint}{}" \
            < /tmp/index-paths.txt || true
          echo "Touched $(wc -l < /tmp/index-paths.txt) index files; polling until the lockfile resolves..."
          for i in $(seq 1 40); do
            if cargo fetch --locked > /tmp/cargo-fetch.log 2>&1; then
              echo "Index covers the whole lockfile (attempt ${i})."
              exit 0
            fi
            # Only an index that hasn't caught up yet is worth waiting out;
            # anything else (stale lockfile, auth, network) won't improve
            # with retries, so surface it immediately.
            if ! grep -q "failed to select a version\|not found in registry" /tmp/cargo-fetch.log; then
              echo "cargo fetch failed with a non-index error:" >&2
              tail -n 20 /tmp/cargo-fetch.log >&2
              exit 1
            fi
            grep -m1 "failed to select a version" /tmp/cargo-fetch.log || tail -n 3 /tmp/cargo-fetch.log
            if [ "$i" -lt 40 ]; then
              echo "Index still refreshing (attempt ${i}/40) — retrying in 30s..."
              sleep 30
            fi
          done
          echo "Timed out waiting for the CodeArtifact index to include all locked versions." >&2
          tail -n 20 /tmp/cargo-fetch.log >&2
          exit 1

      - name: Publish ninox-ptyd
        if: steps.config.outputs.configured == 'true' && steps.plan.outputs.ptyd_publish == 'true'
        run: |
          cargo publish -p ninox-ptyd --registry "$CODEARTIFACT_REPOSITORY"
          /tmp/wait-for-crate.sh ninox-ptyd "${{ steps.plan.outputs.ptyd_version }}"

      - name: Publish ninox-core
        if: steps.config.outputs.configured == 'true' && steps.plan.outputs.core_publish == 'true'
        run: |
          cargo publish -p ninox-core --registry "$CODEARTIFACT_REPOSITORY"
          /tmp/wait-for-crate.sh ninox-core "${{ steps.plan.outputs.core_version }}"

      - name: Publish ninox-server
        if: steps.config.outputs.configured == 'true' && steps.plan.outputs.server_publish == 'true'
        run: |
          cargo publish -p ninox-server --registry "$CODEARTIFACT_REPOSITORY"
          /tmp/wait-for-crate.sh ninox-server "${{ steps.plan.outputs.server_version }}"

      - name: Publish ninox
        if: steps.config.outputs.configured == 'true' && steps.plan.outputs.app_publish == 'true'
        run: cargo publish -p ninox --registry "$CODEARTIFACT_REPOSITORY"

  release:
    name: Create GitHub Release
    needs: publish
    if: needs.publish.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write # AWS OIDC for the generic-package publish below
    env:
      GH_TOKEN: ${{ github.token }}
      CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN }}
      CODEARTIFACT_DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
      CODEARTIFACT_REPOSITORY: ${{ vars.CODEARTIFACT_REPOSITORY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CODEARTIFACT_PUBLISH_ROLE_ARN: ${{ vars.CODEARTIFACT_PUBLISH_ROLE_ARN }}
      GENERIC_NAMESPACE: ninox
      GENERIC_PACKAGE: ninox-macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Idempotent: a re-run against a tag that already has a release (e.g.
      # after a previous attempt failed partway through) reuses it — either
      # the draft left behind by a failed bundle upload, or a release that
      # already went live — instead of erroring or creating a duplicate.
      - name: Ensure a draft release exists for this tag
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — reusing it."
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Cache Rust
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-bundle-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bundle-

      - name: Build, sign & verify Ninox.app
        id: build
        uses: ./.github/actions/build-macos-bundle

      - name: Upload to release
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${{ steps.build.outputs.zip-path }}"

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.CODEARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Same rule as the crate plan step: only ResourceNotFoundException
      # means "not published yet"; any other error fails rather than risk a
      # duplicate publish.
      - name: Determine macOS binary publish plan
        id: binplan
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="ninox") | .version')
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "ninox crate version ${version} doesn't match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ca=(--domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER"
              --repository "$CODEARTIFACT_REPOSITORY" --format generic
              --namespace "$GENERIC_NAMESPACE" --package "$GENERIC_PACKAGE" --package-version "$version")
          if status=$(aws codeartifact describe-package-version "${ca[@]}" \
              --query packageVersion.status --output text 2> /tmp/describe.err); then
            echo "${GENERIC_PACKAGE} ${version} exists with status ${status}."
          elif grep -q "ResourceNotFoundException" /tmp/describe.err; then
            status=absent
          else
            cat /tmp/describe.err >&2
            exit 1
          fi
          if [ "$status" = "Published" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            : > /tmp/existing-assets.txt
          elif [ "$status" = "absent" ] || [ "$status" = "Unfinished" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ "$status" = "Unfinished" ]; then
              aws codeartifact list-package-version-assets "${ca[@]}" \
                --query 'assets[].name' --output text | tr '\t' '\n' > /tmp/existing-assets.txt
            else
              : > /tmp/existing-assets.txt
            fi
          else
            echo "${GENERIC_PACKAGE} ${version} is in status ${status}; refusing to publish over it." >&2
            exit 1
          fi

      - name: Package macOS binary
        if: steps.binplan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.binplan.outputs.version }}
          APP_ZIP: ${{ steps.build.outputs.zip-path }}
        run: |
          set -euo pipefail
          stem="ninox-${VERSION}-aarch64-apple-darwin"
          dist="$RUNNER_TEMP/dist"
          stage="$RUNNER_TEMP/$stem"
          mkdir -p "$dist" "$stage"
          # cargo bundle builds target/release/ninox before copying it into
          # the bundle, so this is the same build as Ninox.app's binary.
          test -x target/release/ninox
          [ "$(lipo -archs target/release/ninox)" = "arm64" ]
          cp target/release/ninox "$stage/ninox"
          codesign --force --sign - "$stage/ninox"
          codesign --verify --strict "$stage/ninox"
          cp LICENSE "$stage/LICENSE"
          cat > "$stage/README.txt" <<EOF
          ninox ${VERSION} (aarch64-apple-darwin)

          Copy \`ninox\` onto your PATH (e.g. ~/.local/bin) and symlink \`nx\` to it,
          or use scripts/install-macos.sh, which does that and verifies checksums.
          Update in place later with \`ninox update\`.
          EOF
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP" -czf "$dist/${stem}.tar.gz" "$stem"
          cp scripts/install-macos.sh "$dist/install-macos.sh"
          cp "$APP_ZIP" "$dist/Ninox.app.zip"
          (cd "$dist" && shasum -a 256 install-macos.sh "${stem}.tar.gz" Ninox.app.zip)
          echo "DIST=$dist" >> "$GITHUB_ENV"

      - name: Publish macOS binaries to CodeArtifact
        if: steps.binplan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.binplan.outputs.version }}
        run: |
          set -euo pipefail
          # Order matters: the final asset is published without --unfinished,
          # which is what flips the version to Published.
          assets=(install-macos.sh "ninox-${VERSION}-aarch64-apple-darwin.tar.gz" Ninox.app.zip)
          last=$(( ${#assets[@]} - 1 ))
          for i in "${!assets[@]}"; do
            asset="${assets[$i]}"
            if grep -qxF "$asset" /tmp/existing-assets.txt; then
              echo "${asset} already uploaded to the Unfinished version — skipping."
              if [ "$i" -eq "$last" ]; then
                # Uploading the last asset is what normally flips the version
                # to Published; it's already there, so flip it explicitly.
                echo "Marking ${GENERIC_PACKAGE} ${VERSION} Published"
                aws codeartifact update-package-versions-status \
                  --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
                  --repository "$CODEARTIFACT_REPOSITORY" --format generic \
                  --namespace "$GENERIC_NAMESPACE" --package "$GENERIC_PACKAGE" \
                  --versions "$VERSION" --expected-status Unfinished --target-status Published > /dev/null
              fi
              continue
            fi
            finish_flag=--unfinished
            [ "$i" -eq "$last" ] && finish_flag=--no-unfinished
            sha=$(shasum -a 256 "$DIST/$asset" | cut -d' ' -f1)
            echo "Publishing ${asset} (sha256 ${sha})"
            aws codeartifact publish-package-version \
              --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
              --repository "$CODEARTIFACT_REPOSITORY" --format generic \
              --namespace "$GENERIC_NAMESPACE" --package "$GENERIC_PACKAGE" \
              --package-version "$VERSION" \
              --asset-content "$DIST/$asset" --asset-name "$asset" --asset-sha256 "$sha" \
              "$finish_flag" > /dev/null
          done
          status=$(aws codeartifact describe-package-version \
            --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY" --format generic \
            --namespace "$GENERIC_NAMESPACE" --package "$GENERIC_PACKAGE" \
            --package-version "$VERSION" --query packageVersion.status --output text)
          echo "${GENERIC_PACKAGE} ${VERSION} status: ${status}"
          [ "$status" = "Published" ]
