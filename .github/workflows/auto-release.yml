name: Automatic release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue runs instead of cancelling an earlier merge. A run that was already
# included in an earlier release only retries dispatching that release.
concurrency:
  group: auto-release-main
  queue: max

jobs:
  version-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Bump, tag, and start publishing
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag=''
          for attempt in 1 2 3 4 5; do
            git fetch --force --tags origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            git merge-base --is-ancestor "$EVENT_SHA" HEAD || {
              echo 'The triggering commit is no longer on main' >&2; exit 1;
            }
            latest=$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)
            [ -n "$latest" ] || { echo 'No stable version tag exists' >&2; exit 1; }
            git merge-base --is-ancestor "$latest" HEAD || {
              echo "Latest tag $latest is not on main" >&2; exit 1;
            }
            if git merge-base --is-ancestor "$EVENT_SHA" "$latest"; then
              tag="$latest"
              break
            fi
            current=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("crates/ninox-core/Cargo.toml").read_text())["package"]["version"])')
            [ "v$current" = "$latest" ] || {
              echo "Workspace version $current does not match latest tag $latest" >&2; exit 1;
            }
            version=$(python3 scripts/bump-release-version.py)
            tag="v$version"
            git add Cargo.lock crates/*/Cargo.toml
            git commit -m "chore(release): $tag"
            git tag "$tag"
            # Push both refs together. A concurrent merge rejects the whole
            # transaction, so refetch and include that merge in this release.
            if git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"; then
              break
            fi
            git tag -d "$tag"
            tag=''
          done
          [ -n "$tag" ] || { echo 'Could not push the release after five attempts' >&2; exit 1; }
          # The deploy key pushes the tag as an external actor, so the tag
          # push starts release.yml and publish.yml exactly as a manual tag does.
