name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Clippy + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # The runner image ships ~25 GB of toolchains this job never uses.
      # A restored cargo cache plus a large feature-unification rebuild
      # (any PR that reshapes Cargo.lock) doubles much of target/ and can
      # overflow the remaining disk — observed as the runner worker dying
      # with "No space left on device" and ld taking SIGBUS mid-link.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/ghc
          df -h /
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            tmux \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config
      - name: Cache Rust
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: tmux start-server && cargo test --workspace

  # The stock-Ubuntu-22.04 gate, split into two parallel jobs so neither
  # builds the whole workspace at once. It ran as a single job that built
  # `-p ninox` (the full binary) and then the inference test; that one graph
  # — aws-sdk-s3, the prebuilt ONNX Runtime (via ort/fastembed), sqlite AND
  # the iced/wgpu UI stack — overflowed the container's share of the host's
  # ~14 GB root disk (a linker SIGBUS, then `No space left on device`).
  # Splitting by crate gives each job a smaller graph on its own runner
  # disk, and they run concurrently; `-core` never pulls iced/wgpu at all.
  #
  # Both run in a bare ubuntu:22.04 container, NOT the ubuntu-22.04 runner
  # image: GitHub runner images preinstall libssl-dev and a newer GCC, which
  # is exactly what let two Ubuntu 22.04 install breakages ship unnoticed
  # (openssl-sys pulled in via fastembed's native-tls defaults, and the
  # GCC 13+ `__cxa_call_terminate` reference in ort-sys's prebuilt ONNX
  # Runtime). Stock Ubuntu 22.04 is glibc 2.35, GCC 11, no OpenSSL headers,
  # and this gate keeps `cargo install ninox` working on it.
  #
  # `CARGO_PROFILE_DEV_DEBUG: 0` drops debuginfo — roughly halving target/,
  # the extra headroom that keeps each job on disk. It's irrelevant to what
  # these jobs prove (linking + runtime), which is why a dev profile is fine
  # here in the first place: the guarded failures (a -sys crate demanding
  # missing system headers, unresolvable symbols in the prebuilt static ONNX
  # Runtime) surface regardless of profile, and dev links the same native
  # libraries `cargo install`'s release build does.

  # Native-linkage-heavy graph (no iced/wgpu): proves the aws/onnx/sqlite
  # `-sys` crates build and link on stock 22.04, then that ONNX actually
  # *runs* — static constructors under this libstdc++ can segfault even when
  # linking succeeds, so real inference through the prebuilt runtime is the
  # only true check. The `--ignored fast_embed_embedder` filter pins this to
  # the embedder tests: a bare `-- --ignored` would also sweep in unrelated
  # ignored tests (e.g. the 5000-file brain rebuild benchmark). Single-
  # threaded so the two tests can't race the fresh model download into the
  # shared fastembed cache on a cold runner.
  build-oldest-linux-core:
    name: Build ninox-core on stock Ubuntu 22.04
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config git cmake \
            libxkbcommon-dev libwayland-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Rust
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ninox
            target
          key: ubuntu2204-core-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu2204-core-cargo-
      - name: Build ninox-core
        run: cargo build --locked -p ninox-core
      - name: Real-inference embedder tests
        run: cargo test --locked -p ninox-core -- --ignored fast_embed_embedder --test-threads=1

  # Full-binary graph (adds the iced/wgpu UI stack): proves `-p ninox` links
  # end to end, then that the binary starts — which covers ONNX Runtime
  # static-init, the runtime failure mode link success alone can't catch.
  build-oldest-linux-app:
    name: Build ninox binary on stock Ubuntu 22.04
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config git cmake \
            libxkbcommon-dev libwayland-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Rust
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu2204-app-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu2204-app-cargo-
      - name: Build ninox
        run: cargo build --locked -p ninox
      - name: Binary smoke test
        run: ./target/debug/ninox --help > /dev/null

  bundle-macos:
    name: macOS App Bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Cache Rust
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/Library/Caches/ort.pyke.io
            target
          # v2: the cache key must change whenever the cached *paths* change
          # (not just Cargo.lock) — bumping straight to a new key here forces
          # this run to do a full rebuild that actually re-executes the
          # `ort-sys` build script and repopulates `~/Library/Caches/ort.pyke.io`
          # from scratch, rather than restoring the old `v1` cache (which
          # never captured that directory) and skipping the build script
          # because its `target/` fingerprint looks up to date — the actual
          # bug behind the "library 'clang_rt.osx' not found" / missing
          # ort.pyke.io search-path link failures.
          key: ${{ runner.os }}-cargo-bundle-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bundle-v2-
      - name: Build, sign & verify Ninox.app
        uses: ./.github/actions/build-macos-bundle
        with:
          zip: "false"
